<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 플래너</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M4 15v-3l2-5h12l2 5v3M4 15h16M4 15v3M20 15v3"/><circle cx="8" cy="13" r=".8"/><circle cx="16" cy="13" r=".8"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
<symbol id="i-nav" viewBox="0 0 24 24"><path d="M12 3l7 17-7-4-7 4z"/></symbol>
<symbol id="i-spot" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8.5 7l1.5-3h4l1.5 3"/></symbol>
<symbol id="i-food" viewBox="0 0 24 24"><path d="M5 3v5a2 2 0 0 0 4 0V3M7 3v18M17 21V3c-2 1-3.5 4-3.5 8H17"/></symbol>
<symbol id="i-cafe" viewBox="0 0 24 24"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10.5h1.5a2.5 2.5 0 0 1 0 5H16.5M8 3v3M12 3v3"/></symbol>
<symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 5v14M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11.5" r="1.8"/></symbol>
<symbol id="i-shoe" viewBox="0 0 24 24"><path d="M3 18h18M3 18v-4l2-7 3.5 1c.5 2 2 3 4 3.3l5 1C20 13 21 14.5 21 16.5V18"/><path d="M10 11l1-2M13 11.5l1-2"/></symbol>
<symbol id="i-grip" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></symbol>
<symbol id="i-alt" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M6 8.5v3a6 6 0 0 0 6 6h3.5" stroke-dasharray="2.5 2.5"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 14l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
<symbol id="i-tap" viewBox="0 0 24 24"><path d="M9 12V5.5a1.5 1.5 0 0 1 3 0V11l4.6 1a2 2 0 0 1 1.5 2.3L17.2 20H10l-3.7-5a1.5 1.5 0 0 1 2.4-1.8L9 14"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
</svg>

<div id="app">
  <div id="kmap" hidden></div>
  <svg id="map" role="img" aria-label="일정 경로 지도"></svg>
  <div id="mk"></div>
  <div class="top">
    <button class="fab" id="home-open" aria-label="여행 목록"></button>
    <button class="pill" id="open-s">장소 검색</button>
    <button class="fab" id="refit" aria-label="이 날 경로 전체 보기"></button>
    <button class="fab" id="gps" aria-label="내 위치 표시"></button>
  </div>
  <div id="ordbar" role="status"></div>
  <div id="legend" aria-label="지도 표시 범례"></div>
  <div id="toast" role="status"></div>
  <button id="veil" aria-label="지도 보기 (일정 창 내리기)"></button>

  <section id="sheet" aria-label="여행 일정">
    <div id="dz">
      <div class="handle"></div>
      <div class="head" id="head-view">
        <div class="hv"><span id="ttl-text"></span><span id="date-text" class="sub"></span></div>
        <button class="ib" id="edit-btn" aria-label="여행 이름·출발일 수정"></button>
        <button class="ib" id="share-btn" aria-label="일정 공유"></button>
      </div>
      <div class="head" id="head-edit" hidden>
        <input id="title" aria-label="여행 이름" maxlength="40" value="제주 가을 여행">
        <input id="dstart" type="date" aria-label="출발일" value="2026-10-24">
        <button class="chip" id="edit-done">완료</button>
      </div>
    </div>
    <div id="grab">
      <div id="shnote" role="status"></div>
      <div id="tabs" role="tablist"></div>
      <div id="sum"></div>
      <div id="gstat" role="status"></div>
    </div>
    <div id="list"></div>
  </section>

  <section id="home" aria-label="내 여행"></section>
  <div id="newtrip" role="dialog" aria-label="새 여행"></div>
  <div id="sharebox"></div>
  <div id="search" role="dialog" aria-label="장소 검색">
    <div class="sh">
      <button class="ib" id="sclose" aria-label="검색 닫기"></button>
      <input id="sq" type="search" placeholder="성산일출봉, 카페, 흑돼지" autocomplete="off">
    </div>
    <div class="chips" id="sc"></div>
    <div id="sres"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/sheet.js"></script>
<script src="js/ui.js"></script>
<script src="js/gps.js"></script>
<script src="js/kakao.js"></script>
<script src="js/route.js"></script>
<script src="js/trips.js"></script>
<script src="js/plan.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
